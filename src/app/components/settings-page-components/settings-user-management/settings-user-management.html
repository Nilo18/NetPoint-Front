<section class="settingsmanagement">
    <!-- <p>settings-user-management works!</p> -->
    <div class="settingsmanagement__header">
        <div class="settingsmanagement__header--text">
            <h4>User Management</h4>
            <p>Manage team members and their access levels</p>
        </div>
        <button class="settingsmanagement__header--btn" (click)="open($event)">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="lucide lucide-user-plus h-4 w-4 mr-2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="19" x2="19" y1="8" y2="14"></line>
                <line x1="22" x2="16" y1="11" y2="11"></line>
            </svg>
            Add User
        </button>
    </div>
    <div class="settingsmanagement__body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Role</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (user of userList(); track user.id; let i = $index) {
                    <tr>
                        <th scope="row">{{ i + 1}}</th>
                        <td>{{ user.name }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.role }}</td>
                        <td>
                            <button class="settingsmanagement__body--deletebtn" (click)="deleteUser(user.id)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2 lucide-trash-2 h-4 w-4">
                                    <path d="M3 6h18">                                 
                                    </path>
                                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6">
                                    </path>
                                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2">
                                    </path>
                                    <line x1="10" x2="10" y1="11" y2="17">
                                    </line>
                                    <line x1="14" x2="14" y1="11" y2="17">
                                    </line>
                                </svg>
                            </button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</section>
