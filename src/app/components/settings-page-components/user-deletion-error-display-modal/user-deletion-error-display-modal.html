<div class="modal-content delete-error-modal">
    <div class="modal-header">
        <div class="delete-error-modal__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <div class="delete-error-modal__heading">
            <h5 class="modal-title">Couldn't Delete User</h5>
            <p>An error occurred while processing your request.</p>
        </div>
        <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
    </div>
    <div class="modal-body">
        <div class="delete-error-modal__msg">
            <span>Error details</span>
            <p>{{ errMsg }}</p>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="delete-error-modal__close" data-bs-dismiss="modal" (click)="closeModal()">
            Dismiss
        </button>
    </div>
</div>
