<div class="error-state">
    <div class="error-state__icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="#FCA5A5" stroke-width="1.5"/>
            <circle cx="24" cy="24" r="18" fill="#FEF2F2"/>
            <path d="M24 14v12" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="32" r="1.5" fill="#EF4444"/>
        </svg>
    </div>
    <h3 class="error-state__title">Something went wrong</h3>
    <p class="error-state__message">{{ userInviteStateService.backendErrorMsg() }}</p>
    <button class="error-state__retry btn btn-outline-primary"
    (click)="userInviteStateService.validateToken()">
        Try again
    </button>
</div>
