<section class="controls" aria-label="Search, sort, and filter sales">
  <label class="controls__search">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-4-4" />
    </svg>
    <span class="controls__sr-only">Search sales</span>
    <input
      type="search"
      placeholder="Search by sale ID, cashier, or product..."
      [formControl]="searchControl"
    />
  </label>

  <div class="controls__groups">
    <div class="controls__group">
      <div class="controls__field">
        <label for="sort-by">Sort by</label>
        <select id="sort-by" [disabled]="loading()" (change)="onSortByChange($event)">
          <option value="date">Date</option>
          <option value="revenue">Revenue</option>
          <option value="profit">Profit</option>
          <option value="margin">Margin</option>
        </select>
      </div>

      <div class="controls__field">
        <label for="direction">Direction</label>
        <select id="direction" [disabled]="loading()" (change)="onSortDirectionChange($event)">
          <option value="desc">Descending</option>
          <option value="asc">Ascending</option>
        </select>
      </div>
    </div>

    <div class="controls__group">
      <div class="controls__field">
        <label for="filter-by">Filter by</label>
        <select id="filter-by" [disabled]="loading()" (change)="onFilterByChange($event)">
          <option value="totalRevenue">Revenue</option>
          <option value="totalCost">Cost</option>
          <option value="totalProfit">Profit</option>
          <option value="marginPercent">Margin %</option>
          <option value="date">Date</option>
        </select>
      </div>

      <div class="controls__field controls__field--number">
        <label for="filter-from">From</label>
        <input
          id="filter-from"
          [type]="filterRange().filterBy === 'date' ? 'date' : 'number'"
          [attr.min]="filterRange().filterBy === 'date' ? null : 0"
          [placeholder]="filterRange().filterBy === 'date' ? '' : 'Min'"
          [disabled]="loading()"
          (change)="onFilterFromChange($event)"
        />
      </div>

      <div class="controls__field controls__field--number">
        <label for="filter-to">To</label>
        <input
          id="filter-to"
          [type]="filterRange().filterBy === 'date' ? 'date' : 'number'"
          [attr.min]="filterRange().filterBy === 'date' ? null : 0"
          [placeholder]="filterRange().filterBy === 'date' ? '' : 'Max'"
          [disabled]="loading()"
          (change)="onFilterToChange($event)"
        />
      </div>
    </div>
  </div>
</section>
