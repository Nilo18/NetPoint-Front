<section class="expense-products" aria-label="Product list">
  <div class="expense-products__search">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    class="lucide lucide-search absolute left-3 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path></svg>
    <input type="search" placeholder="Search products..." aria-label="Search products">
  </div>

  <div class="expense-products__grid">
    @for (product of products; track product.name) {
      <article class="expense-products__card" tabindex="0">
        <div class="expense-products__image" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none"stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-dollar-sign h-12 w-12 text-gray-400 group-hover:text-[#4F46E5] transition-colors">
            <line x1="12" x2="12" y1="2" y2="22"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </div>

        <div class="expense-products__details">
          <h3 class="expense-products__name">{{ product.name }}</h3>
          <div class="expense-products__meta">
            <p class="expense-products__price">{{ product.price }}</p>
            <p class="expense-products__stock">Stock: {{ product.stock }}</p>
          </div>
        </div>
      </article>
    }
  </div>
</section>
