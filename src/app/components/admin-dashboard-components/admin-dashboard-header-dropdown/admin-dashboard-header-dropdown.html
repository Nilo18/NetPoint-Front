<div class="admin-dashboard-dropdown" role="menu" (click)="$event.stopPropagation()">
  <div class="admin-dashboard-dropdown__identity">
    <strong class="admin-dashboard-dropdown__name">{{ name() || 'User' }}</strong>
    <span class="admin-dashboard-dropdown__role">{{ role() || 'Role unavailable' }}</span>
  </div>

  <nav class="admin-dashboard-dropdown__menu" aria-label="Account menu">
    @if (!isCashier()) {
      <a class="admin-dashboard-dropdown__item" routerLink="/audit-logs" role="menuitem">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 5h6M9 3h6v4H9zM7 5H5v16h14V5h-2M8 11h8M8 15h8" />
        </svg>
        <span>Audit Logs</span>
      </a>
    }

    <a class="admin-dashboard-dropdown__item" routerLink="/settings" role="menuitem">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.07a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.07 14H3v-4h.07A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.97 4.6 1.7 1.7 0 0 0 10 3.07V3h4v.07a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 20.93 10H21v4h-.07A1.7 1.7 0 0 0 19.4 15Z" />
      </svg>
      <span>Settings</span>
    </a>

    <button class="admin-dashboard-dropdown__item admin-dashboard-dropdown__item--logout" type="button" role="menuitem" (click)="logout()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3" />
      </svg>
      <span>Log Out</span>
    </button>
  </nav>
</div>
