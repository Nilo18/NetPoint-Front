<div class="dashboard-filtering">
    <div class="dashboard-filtering__filter-by">
        <label>Filter by</label>
        <select class="form-select" [(ngModel)]="filterObj.filterBy">
            <option value="stock">Stock</option>
            <option value="retailPrice">Retail Price</option>
            <option value="wholesalePrice">Wholesale Price</option>
            <option value="Profitability">Profitability</option>
        </select>
    </div>
    <div class="dashboard-filtering__from">
        <label>From</label>
        <input type="number" class="form-control" [(ngModel)]="filterObj.filterFrom" min="0" max="100000000">
    </div>
    <div class="dashboard-filtering__to">
        <label>To</label>
        <input type="number" class="form-control" [(ngModel)]="filterObj.filterTo" min="0" max="100000000">
    </div>
    <button (click)="filter()">Filter</button>
</div>
