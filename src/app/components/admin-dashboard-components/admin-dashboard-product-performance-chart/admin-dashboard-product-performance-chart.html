<article class="product-performance-chart" aria-labelledby="product-performance-title">
  <h2 id="product-performance-title" class="product-performance-chart__title">Product Performance</h2>

  <div class="product-performance-chart__canvas">
    @if (loading()) {
      <div class="product-performance-chart__state" role="status" aria-live="polite">
        <span class="product-performance-chart__spinner" aria-hidden="true"></span>
        <span>Loading chart data...</span>
      </div>
    } @else if (errorMessage()) {
      <div
        class="product-performance-chart__state product-performance-chart__state--error"
        role="alert"
      >
        {{ errorMessage() }}
      </div>
    } @else {
      <canvas
        baseChart
        aria-label="Top product performance by profit"
        role="img"
        type="bar"
        [data]="barChartData()"
        [options]="barChartOptions"
      ></canvas>
    }
  </div>
</article>
