<article class="chart-card" aria-labelledby="product-performance-title">
  <h2 id="product-performance-title" class="chart-card__title">Product Performance</h2>

  <div class="chart-card__canvas">
    @if (loading()) {
      <div class="chart-card__state" role="status" aria-live="polite">
        <span class="chart-card__spinner" aria-hidden="true"></span>
        <span>Loading chart data...</span>
      </div>
    } @else if (errorMessage()) {
      <div class="chart-card__state chart-card__state--error" role="alert">
        {{ errorMessage() }}
      </div>
    } @else {
      <canvas
        baseChart
        aria-label="Top product performance by profit"
        role="img"
        type="bar"
        [data]="barChartData()"
        [options]="barChartOptions"
      ></canvas>
    }
  </div>
</article>
