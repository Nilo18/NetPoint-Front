<article class="revenue-chart" aria-labelledby="revenue-profit-title">
  <h2 id="revenue-profit-title" class="revenue-chart__title">Revenue &amp; Profit Trends</h2>

  <div class="revenue-chart__canvas">
    @if (loading()) {
      <div class="revenue-chart__state" role="status" aria-live="polite">
        <span class="revenue-chart__spinner" aria-hidden="true"></span>
        <span>Loading chart data...</span>
      </div>
    } @else if (errorMessage()) {
      <div class="revenue-chart__state revenue-chart__state--error" role="alert">
        {{ errorMessage() }}
      </div>
    } @else {
      <canvas
        baseChart
        aria-label="Revenue and profit trends"
        role="img"
        type="line"
        [data]="lineChartData()"
        [options]="lineChartOptions()"
      ></canvas>
    }
  </div>
</article>
