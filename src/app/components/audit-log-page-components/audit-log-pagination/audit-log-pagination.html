<nav aria-label="Audit log pages" class="audit-log-pagination">
  <ul class="pagination">
    <li class="page-item">
      <button
        type="button"
        class="page-link"
        aria-label="Previous page"
        [disabled]="loading() || totalPages() <= 1"
        (click)="changePage(currentPage() - 1)"
      >
        <span aria-hidden="true">&laquo;</span>
      </button>
    </li>

    @for (page of visiblePages(); track page) {
      <li class="page-item">
        <button
          type="button"
          class="page-link"
          [class.selected-page]="currentPage() === page"
          [attr.aria-current]="currentPage() === page ? 'page' : null"
          [disabled]="loading()"
          (click)="changePage(page)"
        >
          {{ page }}
        </button>
      </li>
    }

    <li class="page-item">
      <button
        type="button"
        class="page-link"
        aria-label="Next page"
        [disabled]="loading() || totalPages() <= 1"
        (click)="changePage(currentPage() + 1)"
      >
        <span aria-hidden="true">&raquo;</span>
      </button>
    </li>
  </ul>
  <p class="loading" aria-live="polite">
    {{ loading() ? 'Loading page…' : 'Total Pages: ' + totalPages() }}
  </p>
</nav>
