<section class="audit-log-stats" [attr.aria-busy]="auditLogStats.isLoading()">
  @if (auditLogStats.isLoading()) {
    @for (placeholder of [1, 2, 3, 4, 5, 6, 7]; track placeholder) {
      <div class="audit-log-stats__stat audit-log-stats__stat--loading" aria-hidden="true">
        <span></span>
        <span></span>
      </div>
    }
    <span class="audit-log-stats__loading-label">Loading audit log statistics…</span>
  } @else {
    @for (stat of stats(); track stat.statName) {
        <div class="audit-log-stats__stat">
            <p>{{ stat.statName }}</p>
            <p>{{ stat.statNumber }}</p>
        </div>
    }
  }
</section>
