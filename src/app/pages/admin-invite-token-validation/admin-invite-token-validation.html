@if (!shouldShowForm()) {
    <section class="admin-signup">
        @if (!gotError()) {
            <app-loading-spinner></app-loading-spinner>
        } @else {
            <div class="error-state">
                <div class="error-state__icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="24" r="22" stroke="#FCA5A5" stroke-width="1.5"/>
                        <circle cx="24" cy="24" r="18" fill="#FEF2F2"/>
                        <path d="M24 14v12" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="24" cy="32" r="1.5" fill="#EF4444"/>
                    </svg>
                </div>
                <h3 class="error-state__title">Something went wrong</h3>
                <p class="error-state__message">{{ backendErrorMsg() }}</p>
                <button class="error-state__retry btn btn-outline-primary" (click)="validateToken()">
                    Try again
                </button>
            </div>
        }
    </section>
} @else {
    <section class="admin-signup">
        <!-- <p>Session validated successfully! Please sign up to proceed</p> -->
        <div class="form__content">
            <div class="form__header">
                <div class="form__icon">
                    <img src="/assets/netpoint-logo.png" alt="Logo">
                </div>
                @if (successfulResMsg) {
                    <h4>{{successfulResMsg}}</h4>
                }
                <p>Create your account to proceed</p>
            </div>
            <form [formGroup]="adminSignupForm" class="form__body admin-signup__body" (ngSubmit)="onSubmit()">
                <div class="form__field-container">
                    <label for="name">Name</label>
                    <input type="text" formControlName="name" class="form-control" placeholder="Your Name">
                    <p class="error">{{ getError('name', adminSignupForm) }}</p>
                </div>
                <!-- <div class="form__field-container">
                    <label for="email">Email</label>
                    <input type="email" formControlName="email" class="form-control"
                    placeholder="you@example.com">
                    <p class="error">{{ getError('email', adminSignupForm) }}</p>
                </div> -->
                <div class="form__field-container">
                    <label for="password">Password</label>
                    <input type="password" formControlName="password" class="form-control"
                    placeholder="Minimum 8 characters">
                    <p class="error">{{ getError('password', adminSignupForm) }}</p>
                </div>
                <!-- <div class="form__field-container">
                    <label for="password">Phone Number</label>
                    <input type="text" formControlName="phone_number" class="form-control"
                    placeholder="+1 555 555 5555" >
                    <p class="error">{{ getError('phone_number', adminSignupForm) }}</p>
                </div> -->
                <button class="form__submitbtn btn btn-primary" type="submit">
                    Sign Up
                </button>
            </form>
        </div>
    </section>
}
