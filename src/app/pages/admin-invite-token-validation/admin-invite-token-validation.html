<section class="admin-signup">
    @if (!adminInviteStateService.shouldShowForm()) {
        @if (!adminInviteStateService.gotError()) {
            <app-loading-spinner></app-loading-spinner>
        } @else {
            <app-admin-invite-error-handler></app-admin-invite-error-handler>
        }
    } @else {
        <app-admin-invite-form></app-admin-invite-form>
    }
</section>
