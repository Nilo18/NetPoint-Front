<app-sales-history-header (exportRequested)="exportCsv()" />

<main class="history-page">
  <app-sales-history-stats
    [stats]="stats.value()"
    [isLoading]="stats.isLoading()"
    [error]="stats.error()"
  />

  <app-sales-history-controls
    (searchChanged)="setSearch($event)"
    (sortByChanged)="setSortBy($event)"
    (sortDirectionChanged)="setSortDirection($event)"
    (filterByChanged)="setFilterBy($event)"
    (filterRangeChanged)="setFilterRange($event)"
    [loading]="sales.isLoading() || stats.isLoading()"
  />

  <app-sales-history-list
    [sales]="sales.value()?.items ?? []"
    [isLoading]="sales.isLoading()"
    [error]="sales.error()"
  />

  <app-sales-history-pagination
    [page]="displayedPage()"
    [pageCount]="displayedPageCount()"
    [loading]="sales.isLoading()"
    (pageChanged)="setPage($event)"
  />
</main>
