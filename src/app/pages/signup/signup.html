<section>
    <div class="signup">
        <div class="signup__content">
            <div class="signup__header">
                <div class="signup__icon">
                    <img src="/assets/netpoint-logo.png" alt="Logo">
                </div>
                <h4>Create Your Account</h4>
                <p>{{ currentStepLabel() }} </p>
            </div>
            @if (!signupService.showNextStep()) {
                <app-signup-first-stage-form></app-signup-first-stage-form>
            } @else { 
                <app-signup-second-stage-form></app-signup-second-stage-form>
            }
        </div>
        <div class="signup__bannerimg">
            <app-auth-banner></app-auth-banner>
        </div>
    </div>
</section>
