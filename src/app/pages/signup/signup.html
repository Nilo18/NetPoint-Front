                <div class="signup__icon">

                    <path d="M8 28 L8 8 L14.5 8 L22 22 L22 8 L28.5 8 L28.5 28 L22 28 L14.5 14 L14.5 28 Z"
                            fill="white"/>

                    <img src="/assets/netpoint-logo.png" alt="Logo">

            }

        <div class="signup__bannerimg">
